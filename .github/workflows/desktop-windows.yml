name: AttendWell desktop (Windows)

on:
  push:
    branches: [feat/desktop-app, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install (repository root and desktop)
        run: |
          bun install --frozen-lockfile
          cd desktop
          bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Versions
        run: |
          bun --version
          node --version
          powershell.exe -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      # One `bun test` per file with a time limit (Bun 1.3.10 crashed part-way through a whole-suite run on Windows and the
      # step then hung until cancelled); a file that crashes Bun is run once more. The merged JUnit file feeds the summary
      # below and is kept as an artifact, with each file's own report and log.
      - name: Unit tests (repository, cloudflare, desktop and runtime)
        timeout-minutes: 20
        run: bun scripts/run-tests-per-file.ts test-results tests cloudflare/tests desktop/tests
      - name: Test summary (totals and every failed test)
        if: always()
        run: bun scripts/ci-test-summary.ts test-results/junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: AttendWell-windows-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Build the Windows register program and fetch cloudflared
        run: |
          bun desktop/scripts/build-sidecar.ts windows-x64
          bun desktop/scripts/fetch-cloudflared.ts windows-x64
      - name: Package the installer (unsigned)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run dist:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AttendWell-windows-x64-installer
          path: desktop/release/*-setup.exe
          if-no-files-found: error
